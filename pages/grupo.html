<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi grupo | No te cuelgues</title>

    <link rel="stylesheet" href="../css/style.css">

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
        defer
    ></script>
    <script src="../javascript/script.js" defer></script>
</head>
<body>
    <header class="encabezado">
        <span class="etiqueta">TU GRUPO, SUS MOMENTOS</span>

        <h1 id="nombre-del-grupo">Cargando grupo…</h1>

        <p>Las personas y los momentos que comparten.</p>

        <a class="boton-enlace" href="grupos.html">
            Volver a mis grupos
        </a>
    </header>

    <main class="contenedor contenedor-agenda">
        <section class="registro" aria-labelledby="titulo-espacio-grupo">
            <h2 id="titulo-espacio-grupo">El espacio del grupo 💜</h2>

            <p id="estado-grupo" role="status">
                Consultando el grupo…
            </p>
        </section>

        <div
        id="lista-cumples-grupo"
        class="lista-cumples-grupo"
></div>
    </main>

    <footer>
        <p>No te cuelgues. Un saludo también cuenta 💜</p>
    </footer>
</body>
</html>
